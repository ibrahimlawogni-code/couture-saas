<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="TailorHub">
  <!--
    Marque TailorHub : un bouton de couture.

    Le disque est plein et ses quatre trous sont evides par la regle
    evenodd : le fond passe au travers. La marque herite de la couleur
    courante, ce qui la rend juste sur clair comme sur fonce sans qu'il
    faille en tenir deux versions.

    Source de verite partagee avec src/app/marque.tsx. Modifier l'un sans
    l'autre ferait diverger l'icone de l'interface.
  -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M24 2.5a21.5 21.5 0 100 43 21.5 21.5 0 000-43zM18 14a4 4 0 100 8 4 4 0 000-8zM30 14a4 4 0 100 8 4 4 0 000-8zM18 26a4 4 0 100 8 4 4 0 000-8zM30 26a4 4 0 100 8 4 4 0 000-8z"
  />
</svg>
